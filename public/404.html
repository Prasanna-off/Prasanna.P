<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Prasanna P</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at center, #14110b 0%, #060609 75%);
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 460px;
        padding: 40px 32px;
        border-radius: 24px;
        background: rgba(12, 12, 18, 0.85);
        border: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      }
      h1 {
        font-size: 4rem;
        line-height: 1;
        background: linear-gradient(135deg, #ffffff 15%, #f3d27a 55%, #b8860b 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 12px;
      }
      p { color: #a1a1aa; line-height: 1.6; margin-bottom: 24px; }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 999px;
        background: rgba(212, 175, 55, 0.16);
        border: 1px solid #f3d27a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a href="/">Back to Portfolio</a>
    </main>
  </body>
</html>
